<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — Mundo de Fe Santo Domingo</title>
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0f1b35;
      color: #fff;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    img { width: 80px; margin-bottom: 2rem; opacity: 0.9; }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 0.5rem;
      color: #c9a84c;
    }
    p {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.7);
      max-width: 380px;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }
    a {
      display: inline-block;
      padding: 0.85rem 2rem;
      background: #c9a84c;
      color: #0f1b35;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <img src="images/logo.png" alt="Mundo de Fe" onerror="this.style.display='none'" />
  <h1>404</h1>
  <p>Esta página no existe, pero hay un lugar para ti en Mundo de Fe.</p>
  <a href="/">Volver al inicio</a>
</body>
</html>
